<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Night Experience</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="app">

    <!-- SCREEN 1: MOOD SELECTION -->
    <section id="screen-mood" class="screen active">
      <h1 class="title">How do you feel tonight</h1>

      <div id="orbit" class="orbit slow">
        <div class="mood-btn" data-mood="romantic">❤️</div>
        <div class="mood-btn" data-mood="playful">😏</div>
        <div class="mood-btn" data-mood="mysterious">🌘</div>
        <div class="mood-btn" data-mood="spicy">🔥</div>
        <div class="mood-btn" data-mood="devilish">😈</div>
      </div>
    </section>

    <!-- SCREEN 2: BRANCH SELECTION -->
    <section id="screen-branch" class="screen hidden">
      <h2 id="branch-title" class="branch-title"></h2>
      <div id="branch-options" class="branch-options"></div>
    </section>

    <!-- SCREEN 3: LAYERED REVEAL -->
    <section id="screen-reveal" class="screen hidden">
      <div id="layer-text" class="layer-text"></div>
      <div id="layer-counter" class="layer-counter"></div>
    </section>

    <!-- SCREEN 4: ENDING -->
    <section id="screen-ending" class="screen hidden">
      <div id="ending-text" class="ending-text"></div>
      <button id="restart-btn" class="restart-btn">Feel something else</button>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
