<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood Orbit</title>

<style>
/* ------------------------------
   BASE
--------------------------------*/
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0d0d0f;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: sans-serif;
  color: #fff;
}

/* ------------------------------
   CENTER QUESTION
--------------------------------*/
.center-question {
  position: absolute;
  font-size: 1.6rem;
  text-align: center;
  z-index: 10;
  pointer-events: none;
}

/* ------------------------------
   ORBIT CONTAINER
--------------------------------*/
.orbit-container {
  position: relative;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Rotating ring */
.orbit {
  position: absolute;
  width: 100%;
  height: 100%;
  animation: spin 12s linear infinite;
  transform-origin: center;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

   <!-- MINI TREES -->
<div id="tree-romantic" class="mini-tree">
  <h2>Romantic tonight?</h2>
  <button>Soft</button>
  <button>Intense</button>
  <button>Unexpected</button>
</div>

<div id="tree-playful" class="mini-tree">
  <h2>Feeling playful?</h2>
  <button>Tease</button>
  <button>Surprise</button>
  <button>Chaos</button>
</div>

<div id="tree-mysterious" class="mini-tree">
  <h2>Something hidden?</h2>
  <button>Reveal</button>
  <button>Stay in the shadows</button>
</div>

<div id="tree-spicy" class="mini-tree">
  <h2>Spicy energy?</h2>
  <button>Slow burn</button>
  <button>All in</button>
</div>

<div id="tree-devilish" class="mini-tree">
  <h2>Devilish mood?</h2>
  <button>Tempt</button>
  <button>Corrupt</button>
</div>

/* ------------------------------
   EMOJIS
--------------------------------*/
.mood-btn {
  position: absolute;
  top: 50%;
  left: 50%;
  font-size: 2rem;
  cursor: pointer;
  transition: transform 0.25s ease, filter 0.25s ease;
  /* start from exact center of the circle */
  transform: translate(-50%, -50%);
}

/* Glow on hover */
.mood-btn:hover {
  transform: translate(-50%, -50%) scale(1.3);
  filter: drop-shadow(0 0 10px rgba(255,255,255,0.7));
}

/* ------------------------------
   EVEN SPACING (5 emojis)
   360° / 5 = 72°
--------------------------------*/
.mood-btn:nth-child(1) {
  transform: translate(-50%, -50%) rotate(0deg) translate(110px) rotate(0deg);
}
.mood-btn:nth-child(2) {
  transform: translate(-50%, -50%) rotate(72deg) translate(110px) rotate(-72deg);
}
.mood-btn:nth-child(3) {
  transform: translate(-50%, -50%) rotate(144deg) translate(110px) rotate(-144deg);
}
.mood-btn:nth-child(4) {
  transform: translate(-50%, -50%) rotate(216deg) translate(110px) rotate(-216deg);
}
.mood-btn:nth-child(5) {
  transform: translate(-50%, -50%) rotate(288deg) translate(110px) rotate(-288deg);
}
</style>
</head>

<body>

<div class="orbit-container">

  <div class="center-question">
    How do you feel tonight
  </div>

  <div id="orbit" class="orbit slow">
    <div class="mood-btn" data-mood="romantic">❤️</div>
    <div class="mood-btn" data-mood="playful">😏</div>
    <div class="mood-btn" data-mood="mysterious">🌘</div>
    <div class="mood-btn" data-mood="spicy">🔥</div>
    <div class="mood-btn" data-mood="devilish">😈</div>
  </div>

</div>

</body>
</html>
