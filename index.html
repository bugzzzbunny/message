<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mood Orbit</title>

<style>
/* ------------------------------
   BASE
--------------------------------*/
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #0d0d0f;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: sans-serif;
  color: #fff;
}

/* ------------------------------
   CENTER QUESTION
--------------------------------*/
.center-question {
  position: absolute;
  font-size: 1.6rem;
  text-align: center;
  z-index: 10;
  pointer-events: none;
}

/* ------------------------------
   ORBIT CONTAINER
--------------------------------*/
.orbit-container {
  position: relative;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Rotating ring */
.orbit {
  position: absolute;
  width: 100%;
  height: 100%;
  animation: spin 12s linear infinite;
  transform-origin: center;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* ------------------------------
   EMOJIS
--------------------------------*/
.mood-btn {
  position: absolute;
  font-size: 2rem;
  cursor: pointer;
  transition: transform 0.25s ease, filter 0.25s ease;
}

/* Glow on hover */
.mood-btn:hover {
  transform: scale(1.3);
  filter: drop-shadow(0 0 10px rgba(255,255,255,0.7));
}

/* ------------------------------
   EVEN SPACING (5 emojis)
--------------------------------*/
/* 360° / 5 = 72° spacing */
.mood-btn:nth-child(1) { transform: rotate(0deg)   translate(130px) rotate(0deg); }
.mood-btn:nth-child(2) { transform: rotate(72deg)  translate(130px) rotate(-72deg); }
.mood-btn:nth-child(3) { transform: rotate(144deg) translate(130px) rotate(-144deg); }
.mood-btn:nth-child(4) { transform: rotate(216deg) translate(130px) rotate(-216deg); }
.mood-btn:nth-child(5) { transform: rotate(288deg) translate(130px) rotate(-288deg); }

</style>
</head>

<body>

<div class="orbit-container">

  <div class="center-question">
    How do you feel tonight
  </div>

  <div id="orbit" class="orbit slow">
    <div class="mood-btn" data-mood="romantic">❤️</div>
    <div class="mood-btn" data-mood="playful">😏</div>
    <div class="mood-btn" data-mood="mysterious">🌘</div>
    <div class="mood-btn" data-mood="spicy">🔥</div>
    <div class="mood-btn" data-mood="devilish">😈</div>
  </div>

</div>

</body>
</html>
