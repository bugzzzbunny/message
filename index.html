<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Night Mode Secret</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="meta">
      <span class="dot"></span>
      <span class="meta-text">typing • 01:17 AM</span>
    </div>

    <div class="content">
      <div id="layer-text" class="layer-text">
        There’s something I only think about after midnight.
      </div>
      <div id="layer-counter" class="layer-counter">
        1 / 4
      </div>
    </div>

    <button id="next-btn" class="next-btn">
      tap to get closer
    </button>
  </div>

  <script src="script.js"></script>
</body>
</html>
