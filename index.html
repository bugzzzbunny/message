<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mood Orbit</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="orbit-container">

    <div class="center-question">
      How do you feel tonight
    </div>

    <div id="orbit" class="orbit slow">
      <div class="mood-btn" data-mood="romantic">❤️</div>
      <div class="mood-btn" data-mood="playful">😏</div>
      <div class="mood-btn" data-mood="mysterious">🌘</div>
      <div class="mood-btn" data-mood="spicy">🔥</div>
      <div class="mood-btn" data-mood="devilish">😈</div>
    </div>

  </div>

  <!-- MINI TREES -->
  <div id="tree-romantic" class="mini-tree">
    <h2>Romantic tonight?</h2>
    <button>Soft</button>
    <button>Intense</button>
    <button>Unexpected</button>
  </div>

  <div id="tree-playful" class="mini-tree">
    <h2>Feeling playful?</h2>
    <button>Tease</button>
    <button>Surprise</button>
    <button>Chaos</button>
  </div>

  <div id="tree-mysterious" class="mini-tree">
    <h2>Something hidden?</h2>
    <button>Reveal</button>
    <button>Stay in the shadows</button>
  </div>

  <div id="tree-spicy" class="mini-tree">
    <h2>Spicy energy?</h2>
    <button>Slow burn</button>
    <button>All in</button>
  </div>

  <div id="tree-devilish" class="mini-tree">
    <h2>Devilish mood?</h2>
    <button>Tempt</button>
    <button>Corrupt</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
